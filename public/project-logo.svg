<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="pl-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="pl-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Top Isometric Layer (Template) - Enlarged & Thickened -->
  <polygon points="24,4 42,12 24,20 6,12" fill="rgba(56, 189, 248, 0.35)" stroke="url(#pl-grad1)" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Bottom Isometric Layer (Project) - Enlarged & Thickened -->
  <polygon points="24,26 42,34 24,42 6,34" fill="rgba(168, 85, 247, 0.35)" stroke="url(#pl-grad2)" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Connecting Git Sync Branch Line - Bold -->
  <path d="M 24 12 L 24 34 M 24 23 C 31 23 34 19 34 15" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Git Commit Nodes - Enlarged -->
  <circle cx="24" cy="12" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="24" cy="34" r="4" fill="#A855F7" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="34" cy="15" r="4" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" />
</svg>
